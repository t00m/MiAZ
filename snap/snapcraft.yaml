name: miaz
base: core24
version: "0.1.26"
summary: Personal Document Organizer
description: |
  MiAZ is a GTK4/Libadwaita desktop application that organises personal
  documents by enforcing a strict 7-field filename convention:
  {date}-{country}-{group}-{sentby}-{purpose}-{concept}-{sentto}

  The directory is the database — no external database required.

  Key features:
  - Multiple independent document repositories
  - Fast workspace handling thousands of documents
  - Powerful sidebar with filters for every field
  - Single and mass renaming of documents
  - Plugin system including AI-assisted field suggestions (Claude, OpenAI,
    Gemini, Ollama), document notes, and column visibility control

grade: stable
confinement: strict

# The gnome extension provides GTK4 from the gnome-46-2404 content snap,
# plus desktop-launch helpers, portal integration, and Wayland/X11 support.
# libadwaita and libpeas are built from source because core24 ships adw 1.5
# (MiAZ requires >= 1.6) and peas 1.x (MiAZ requires peas 2.x).

apps:
  miaz:
    command: usr/bin/miaz
    extensions:
      - gnome
    plugs:
      - home
      - network
    environment:
      PYTHONPATH: $SNAP/usr/share/MiAZ
      GI_TYPELIB_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/girepository-1.0:$SNAP/usr/lib/girepository-1.0
      GSETTINGS_SCHEMA_DIR: $SNAP/usr/share/glib-2.0/schemas
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib

parts:
  libadwaita:
    plugin: meson
    source: https://gitlab.gnome.org/GNOME/libadwaita.git
    source-tag: "1.7.4"
    source-type: git
    meson-parameters:
      - -Dtests=false
      - -Dexamples=false
      - -Dvapi=false
      - -Dgtk_doc=false
    build-packages:
      - libgtk-4-dev
      - libglib2.0-dev
      - libglib2.0-bin
      - sassc
      - gettext
      - libfribidi-dev
      - libpango1.0-dev
      - libcairo2-dev
      - gobject-introspection
      - libgirepository1.0-dev
    prime:
      - usr/lib/*/libadwaita*
      - usr/lib/*/girepository-1.0/Adw*

  libpeas:
    plugin: meson
    source: https://gitlab.gnome.org/GNOME/libpeas.git
    source-tag: "2.0.7"
    source-type: git
    meson-parameters:
      - -Dlua51=false
      - -Dgjs=false
      - -Dpython3=true
      - -Dvapi=false
    build-packages:
      - libglib2.0-dev
      - python3-dev
      - gobject-introspection
      - libgirepository1.0-dev
    stage-packages:
      - python3-gi
    prime:
      - usr/lib/*/libpeas*
      - usr/lib/*/girepository-1.0/Peas*
    after:
      - libadwaita

  miaz:
    plugin: meson
    source: .
    source-type: local
    meson-parameters:
      - -Dprofile=release
      - --prefix=/usr
    build-packages:
      - python3
      - gettext
      - desktop-file-utils
      - appstream
    stage-packages:
      - python3
      - python3-gi
      - python3-gi-cairo
      - gir1.2-gtk-4.0
      - gir1.2-glib-2.0
    after:
      - libadwaita
      - libpeas
    override-prime: |
      craftctl default
      glib-compile-schemas $SNAPCRAFT_PRIME/usr/share/glib-2.0/schemas/
