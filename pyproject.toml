[project]
name = "MiAZ"
version = "0.3.0"
requires-python = ">=3.9"

[project.optional-dependencies]
# API keys are stored with the system libsecret (a runtime OS package) when
# available. 'keyring' is the cross-platform fallback backend.
keyring = ["keyring"]

[tool.ruff]
target-version = "py39"
line-length = 100
# Build artifacts and vendored trees, not source we maintain.
extend-exclude = [
    "_build",
    "builddir_*",
    "AppDir",
    "linuxdeploy-x86_64.AppDir",
    ".flatpak-builder",
    "tmp",
    "repo",
]

[tool.ruff.lint]
# Focus on correctness, not cosmetics. F catches the real bug class we just
# fixed (F821 undefined name). E7/E9 catch bad statements and syntax errors.
# Line length and whitespace are left to the developer for now.
select = ["F", "E7", "E9"]
ignore = [
    # gi.require_version() must run before the matching gi.repository import,
    # so module imports are intentionally not all at the top.
    "E402",
]

# The unused locals that were already here when F841 started being enforced.
# Listing them freezes the backlog instead of exempting the whole project: a
# new one in any other file is now an error. The wholesale ignore this
# replaces let four more in on top of the 43 it was written for.
[tool.ruff.lint.per-file-ignores]
"MiAZ/backend/util.py" = ["F841"]  # 1
"MiAZ/frontend/desktop/services/actions.py" = ["F841"]  # 2
"MiAZ/frontend/desktop/widgets/browserpage.py" = ["F841"]  # 3
"MiAZ/frontend/desktop/widgets/configview.py" = ["F841"]  # 12
"MiAZ/frontend/desktop/widgets/mainwindow.py" = ["F841"]  # 3
"MiAZ/frontend/desktop/widgets/rename.py" = ["F841"]  # 1
"MiAZ/frontend/desktop/widgets/selector.py" = ["F841"]  # 5
"MiAZ/frontend/desktop/widgets/sidebar.py" = ["F841"]  # 2
"MiAZ/frontend/desktop/widgets/views.py" = ["F841"]  # 1
"MiAZ/frontend/desktop/widgets/workspace.py" = ["F841"]  # 2
"data/resources/plugins/HelloWorld/helloworld.py" = ["F841"]  # 1
"data/resources/plugins/MiAZExport2Zip/export2zip.py" = ["F841"]  # 2
"data/resources/plugins/MiAZPeriodicity/periodicity.py" = ["F841"]  # 5
"data/resources/plugins/MiAZProjectMgt/projmgt.py" = ["F841"]  # 1
"tests/test_gate.py" = ["F841"]  # 2
"tests/ui/test_ui_plugin_signals.py" = ["F841"]  # 1
"tests/ui/test_ui_reposettings.py" = ["F841"]  # 1
"tests/ui/test_ui_widgets.py" = ["F841"]  # 2

