name: CI

on:
  push:
    branches:
      - main
      - '0.2'
  pull_request:
    branches:
      - main
      - '0.2'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, lint and metadata
    runs-on: ubuntu-latest
    # A stalled apt or dnf used to burn the 6 hour ceiling before GitHub killed
    # the job. Nothing here takes more than ten minutes when it works.
    timeout-minutes: 30
    # Not ubuntu-latest's own userland: noble ships libadwaita 1.5 and MiAZ
    # calls Adw.InlineViewSwitcher (1.7) and Adw.ShortcutsDialog (1.8). On 1.5
    # the version gate in miaz.py exits before a single test runs, which is how
    # the whole UI suite came to fail at setup with SystemExit. Fedora 43 ships
    # 1.8.7. See tests/test_toolkit_version.py for where the floor comes from.
    container: fedora:43
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # PyGObject (gi) comes from the system packages and is bound to the
      # system Python, so the tests run against it. actions/setup-python
      # installs a separate interpreter that cannot see those bindings, which
      # is why it is not used here. The project floor is 3.9 (requires-python);
      # 3.9 syntax compatibility is enforced statically by ruff's
      # target-version = "py39" in pyproject.toml.
      #
      # The -devel packages are here for their GIR files, which is where
      # test_toolkit_version.py reads the version each API was introduced in.
      - name: Install system dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            python3 python3-pip python3-gobject python3-cairo \
            gtk4 gtk4-devel libadwaita libadwaita-devel \
            libpeas libpeas-loader-python webkitgtk6.0 libsecret \
            libappstream-glib desktop-file-utils \
            xorg-x11-server-Xvfb git

      - name: Install Python tooling
        # A venv created with --system-site-packages can import the system gi
        # while keeping pytest/ruff isolated from the system Python.
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install pytest ruff pytest-cov

      - name: Report the toolkit versions
        # Printed before anything runs: when a job fails on a version floor,
        # this is the line that says so in one look.
        run: |
          .venv/bin/python -c "
          import gi
          gi.require_version('Gtk', '4.0'); gi.require_version('Adw', '1')
          from gi.repository import Gtk, Adw
          print('GTK %d.%d.%d' % (Gtk.MAJOR_VERSION, Gtk.MINOR_VERSION, Gtk.MICRO_VERSION))
          print('Adw %d.%d.%d' % (Adw.MAJOR_VERSION, Adw.MINOR_VERSION, Adw.MICRO_VERSION))
          "

      - name: Lint with ruff
        run: .venv/bin/ruff check MiAZ data/resources/plugins tests

      - name: Run pytest
        env:
          GDK_BACKEND: headless
        run: .venv/bin/python -m pytest tests/ -v --cov=MiAZ --cov-report=term-missing

      # DIAGNOSTIC, temporary. On 20 August the UI step died on the runner with
      # "Trace/breakpoint trap (core dumped)", exit 133, about six seconds in
      # and before pytest printed anything. The same image, commands and
      # toolkit versions (GTK 4.20.4, Adw 1.8.7) pass locally under podman, so
      # this is something about the runner rather than the code. Collecting
      # first splits the question in two: if this step crashes the problem is
      # in importing a test module, and if it passes the problem is in running
      # one. Drop this step once the cause is known.
      - name: Collect the UI tests
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          PYTEST=.venv/bin/python \
            xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            scripts/checks/run_ui_tests.sh --collect-only -q

      - name: Run the UI tests
        # These start the real application against a throwaway repository, so
        # they need a display and the plugin loader. Xvfb provides the first;
        # the runner sandboxes HOME so nothing here touches a real one.
        #
        # -v rather than -q on purpose, for now: a crash takes the process out
        # mid-run, and the per-test lines are what say how far it got. Python
        # buffers 8 KiB when its output is a pipe, which is why the failing run
        # showed nothing at all, so PYTHONUNBUFFERED is what actually makes the
        # log survive the crash. Put -q back when the runner is quiet again.
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          PYTEST=.venv/bin/python \
            xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            scripts/checks/run_ui_tests.sh -v

      # These two run even when the UI step failed. They check metadata, which
      # has nothing to do with the display, and a release is held up by a
      # broken metainfo just as surely.
      - name: Validate AppStream metainfo
        if: always()
        run: appstream-util validate --nonet data/io.github.t00m.MiAZ.metainfo.xml.in

      - name: Validate desktop file
        if: always()
        # desktop-file-validate requires a .desktop extension; the source is a
        # plain (placeholder-free) .desktop.in template that meson merges into
        # the real file, so validate a copy with the correct extension.
        run: |
          tmp="$(mktemp -d)"
          cp data/io.github.t00m.MiAZ.desktop.in "$tmp/io.github.t00m.MiAZ.desktop"
          desktop-file-validate "$tmp/io.github.t00m.MiAZ.desktop"

  build-meson:
    name: Meson build and install
    runs-on: ubuntu-latest
    # This job stalled inside apt-get on 19 August and ran for six hours before
    # GitHub cancelled it. It takes about three minutes when apt answers.
    timeout-minutes: 20
    env:
      # An apt that stops to ask a question waits for an answer nobody will
      # give, which is the shape the six hour run had.
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # This job builds and installs; it never imports the application, so the
      # toolkit version floor that governs the test job does not apply here.
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          # A direct (non-DESTDIR) meson install runs glib-compile-schemas,
          # gtk4-update-icon-cache and update-desktop-database, so pull the
          # packages that provide them (libglib2.0-bin, libgtk-4-bin,
          # desktop-file-utils).
          sudo apt-get install -y \
            ninja-build gettext desktop-file-utils appstream-util \
            libglib2.0-bin libgtk-4-bin
          # meson.build requires >= 1.5.1; Ubuntu apt ships an older one, so
          # install meson from pip.
          python -m pip install --upgrade pip
          pip install "meson>=1.5.1"

      - name: Configure (release profile)
        run: meson setup builddir --prefix="$GITHUB_WORKSPACE/_inst" -Dprofile=release

      - name: Compile
        run: meson compile -C builddir

      - name: Install
        run: meson install -C builddir

      - name: Verify install tree
        run: |
          test -f "_inst/bin/miaz" || { echo "launcher _inst/bin/miaz missing"; exit 1; }
          test -d "_inst/share/MiAZ" || { echo "pkgdatadir _inst/share/MiAZ missing"; exit 1; }
          test -f "_inst/share/glib-2.0/schemas/io.github.t00m.MiAZ.gschema.xml" \
            || { echo "gschema not installed"; exit 1; }
          echo "Install tree looks good."
