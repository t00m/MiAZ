name: CI

# Release branches are named after the version they build, so they are matched
# rather than listed. They used to be listed, and 0.3 was left off both lists:
# the whole series ran with no CI, eighty commits caught by nothing but what
# somebody remembered to run by hand. A branch that is not covered does not
# fail, it simply never runs, so the mistake was invisible.
#
# '[0-9]+.[0-9]+' is a GitHub filter pattern, not a regular expression: '+'
# means one or more of the character class before it, and '.' is literal. It
# matches 0.2, 0.3 and every series after them, including 0.10 and 1.0. It does
# not match the old three-part branches (0.1.26), a branch with a suffix
# (0.1.26-perf-changes), or anything under a prefix (feat/x).
#
# Tags are matched too, because a release is a tag and a release is exactly
# when the full UI suite is worth its twenty-six minutes. See the ui-tests
# job for what runs when.
on:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+'
    tags:
      - 'v[0-9]+.[0-9]+*'
  pull_request:
    branches:
      - main
      - '[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, lint and metadata
    runs-on: ubuntu-latest
    # A stalled apt or dnf used to burn the 6 hour ceiling before GitHub killed
    # the job. Without the UI tests nothing here takes more than three minutes.
    timeout-minutes: 15
    # ubuntu-latest ships libadwaita 1.5, below the 1.7 floor, so the version
    # gate exits before any test runs. Fedora 43 ships 1.8.7.
    container: fedora:43
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # gi is bound to the system Python, so no actions/setup-python here.
      # The -devel packages are for the GIR files test_toolkit_version.py reads.
      # The OCR tools are the ones miaz.spec requires. Without them the OCR
      # tests skip themselves, so a broken `miaz ocr` would pass here.
      # tesseract does not require its English data, and weak deps are off.
      - name: Install system dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            python3 python3-pip python3-gobject python3-cairo \
            gtk4 gtk4-devel libadwaita libadwaita-devel \
            libpeas libpeas-loader-python webkitgtk6.0 libsecret \
            libappstream-glib desktop-file-utils \
            poppler-utils tesseract tesseract-langpack-eng ocrmypdf \
            xorg-x11-server-Xvfb git

      - name: Install Python tooling
        # A venv created with --system-site-packages can import the system gi
        # while keeping pytest/ruff isolated from the system Python.
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install pytest ruff pytest-cov

      - name: Report the toolkit versions
        # Printed before anything runs: when a job fails on a version floor,
        # this is the line that says so in one look.
        run: |
          .venv/bin/python -c "
          import gi
          gi.require_version('Gtk', '4.0'); gi.require_version('Adw', '1')
          from gi.repository import Gtk, Adw
          print('GTK %d.%d.%d' % (Gtk.MAJOR_VERSION, Gtk.MINOR_VERSION, Gtk.MICRO_VERSION))
          print('Adw %d.%d.%d' % (Adw.MAJOR_VERSION, Adw.MINOR_VERSION, Adw.MICRO_VERSION))
          "

      - name: Lint with ruff
        run: .venv/bin/ruff check MiAZ data/resources/plugins tests

      - name: Run pytest
        # GTK 4.20 removed the headless GDK backend, so GDK_BACKEND=headless
        # left this step with no display and the widget-constructing tests
        # (test_thumbnail_textures) segfaulted inside GTK's CSS code. Xvfb
        # already provides the display for the UI tests, so it runs here too.
        #
        # PYTHONUNBUFFERED: a segfaulted pytest loses the tail of its output
        # unless everything was already written, which only unbuffered I/O is.
        env:
          PYTHONUNBUFFERED: "1"
        run: xvfb-run -a .venv/bin/python -m pytest tests/ -v --cov=MiAZ --cov-report=term-missing

      - name: Validate AppStream metainfo
        run: appstream-util validate --nonet data/io.github.t00m.MiAZ.metainfo.xml.in

      - name: Validate desktop file
        # desktop-file-validate requires a .desktop extension; the source is a
        # plain (placeholder-free) .desktop.in template that meson merges into
        # the real file, so validate a copy with the correct extension.
        run: |
          tmp="$(mktemp -d)"
          cp data/io.github.t00m.MiAZ.desktop.in "$tmp/io.github.t00m.MiAZ.desktop"
          desktop-file-validate "$tmp/io.github.t00m.MiAZ.desktop"

  ui-tests:
    # The UI tests drive the real application in process. They are the only
    # thing here that exercises GTK, the plugin loader and the widgets, and
    # they are also, by a wide margin, the slowest: the full 373 take about
    # twenty-six minutes on this runner against fifty seconds for the 1483
    # unit tests. Running all of them on every commit meant every push waited
    # twenty-eight minutes for an answer that lint and the unit suite already
    # had after two.
    #
    # So they are their own job (the fast answers no longer queue behind
    # them) and what runs depends on the event. See the scope step.
    name: UI tests
    runs-on: ubuntu-latest
    # The full suite takes ~26 minutes. This is the ceiling for a hang, not a
    # target; a stalled dnf once burned six hours before GitHub killed it.
    timeout-minutes: 45
    # ubuntu-latest ships libadwaita 1.5, below the 1.7 floor, so the version
    # gate exits before any test runs. Fedora 43 ships 1.8.7.
    container: fedora:43
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # No OCR tools and no metadata validators here: those belong to the unit
      # tests and the validation steps in the `test` job. This job needs the
      # toolkit, the plugin loader, WebKit and a display, and nothing else.
      - name: Install system dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            python3 python3-pip python3-gobject python3-cairo \
            gtk4 libadwaita \
            libpeas libpeas-loader-python webkitgtk6.0 libsecret \
            poppler-utils \
            xorg-x11-server-Xvfb git

      - name: Install Python tooling
        # --system-site-packages so the venv can import the system gi while
        # keeping pytest isolated from the system Python.
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install pytest

      - name: Choose which UI tests to run
        id: scope
        # A push gets the smoke subset: the application starts and does its
        # startup work, the plugins load, a repository opens and switches.
        # That is about four minutes and catches the failures that make the
        # application unusable rather than merely wrong in one widget.
        #
        # Everything else gets all 373. That is a pull request, a tag (a
        # release), and a manual run, which are the three moments where
        # twenty-six minutes is worth paying and none of them happen often.
        #
        # An empty target list means "everything": run_ui_tests.sh appends
        # tests/ui when it is given no path of its own.
        run: |
          if [ "${{ github.event_name }}" = "push" ] \
             && [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "false" ]; then
            echo "label=smoke subset" >> "$GITHUB_OUTPUT"
            echo "targets=tests/ui/test_ui_startup_work.py tests/ui/test_ui_plugins.py tests/ui/test_ui_repository.py" >> "$GITHUB_OUTPUT"
          else
            echo "label=full suite" >> "$GITHUB_OUTPUT"
            echo "targets=" >> "$GITHUB_OUTPUT"
          fi
          echo "Running the ${{ github.event_name }} scope."

      - name: Run the UI tests (${{ steps.scope.outputs.label }})
        # These start the real application against a throwaway repository, so
        # they need a display and the plugin loader. Xvfb provides the first;
        # the runner sandboxes HOME so nothing here touches a real one.
        #
        # Xvfb runs without a window manager, so the toplevel never becomes
        # window-manager-active and GTK does not advance window.get_focus()
        # for a plain grab_focus(). The handful of tests that assert focus
        # detect that and skip themselves; see focus_observable in
        # tests/ui/conftest.py.
        #
        # PYTHONUNBUFFERED: Python buffers 8 KiB into a pipe, so a process
        # killed mid-run loses everything it wrote.
        env:
          PYTHONUNBUFFERED: "1"
          # WebKit sandboxes each view with bubblewrap, which needs a user
          # namespace this runner denies. Never set this for a real user.
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
          # No GPU on the runner, so keep WebKit off the compositing path.
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          PYTEST=.venv/bin/python \
            xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            scripts/checks/run_ui_tests.sh -q ${{ steps.scope.outputs.targets }}

  build-meson:
    name: Meson build and install
    runs-on: ubuntu-latest
    # This job stalled inside apt-get on 19 August and ran for six hours before
    # GitHub cancelled it. It takes about three minutes when apt answers.
    timeout-minutes: 20
    env:
      # An apt that stops to ask a question waits for an answer nobody will
      # give, which is the shape the six hour run had.
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # This job builds and installs; it never imports the application, so the
      # toolkit version floor that governs the test job does not apply here.
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          # A direct (non-DESTDIR) meson install runs glib-compile-schemas,
          # gtk4-update-icon-cache and update-desktop-database, so pull the
          # packages that provide them (libglib2.0-bin, libgtk-4-bin,
          # desktop-file-utils).
          sudo apt-get install -y \
            ninja-build gettext desktop-file-utils appstream-util \
            libglib2.0-bin libgtk-4-bin
          # meson.build requires >= 1.5.1; Ubuntu apt ships an older one, so
          # install meson from pip.
          python -m pip install --upgrade pip
          pip install "meson>=1.5.1"

      - name: Configure (release profile)
        run: meson setup builddir --prefix="$GITHUB_WORKSPACE/_inst" -Dprofile=release

      - name: Compile
        run: meson compile -C builddir

      - name: Install
        run: meson install -C builddir

      - name: Verify install tree
        run: |
          test -f "_inst/bin/miaz" || { echo "launcher _inst/bin/miaz missing"; exit 1; }
          test -d "_inst/share/MiAZ" || { echo "pkgdatadir _inst/share/MiAZ missing"; exit 1; }
          test -f "_inst/share/glib-2.0/schemas/io.github.t00m.MiAZ.gschema.xml" \
            || { echo "gschema not installed"; exit 1; }
          echo "Install tree looks good."
