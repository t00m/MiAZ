name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, lint and metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # PyGObject (gi) is provided by the system apt packages and is bound to
      # the system Python, so the tests run against the runner's system Python.
      # actions/setup-python installs a separate interpreter that cannot see the
      # apt bindings, which is why it is not used here. The project floor is 3.9
      # (requires-python); 3.9/3.10 syntax compatibility is enforced statically
      # by ruff's target-version = "py39" in pyproject.toml.
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            python3 python3-venv python3-gi python3-gi-cairo \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-peas-2 gir1.2-webkit-6.0 \
            appstream-util desktop-file-utils

      - name: Install Python tooling
        # A venv created with --system-site-packages can import the system gi
        # while keeping pytest/ruff isolated from the system Python.
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install pytest ruff pytest-cov

      - name: Lint with ruff
        run: .venv/bin/ruff check MiAZ data/resources/plugins tests

      - name: Run pytest
        env:
          GDK_BACKEND: headless
        run: .venv/bin/python -m pytest tests/ -v --cov=MiAZ --cov-report=term-missing

      - name: Validate AppStream metainfo
        run: appstream-util validate --nonet data/io.github.t00m.MiAZ.metainfo.xml.in

      - name: Validate desktop file
        # desktop-file-validate requires a .desktop extension; the source is a
        # plain (placeholder-free) .desktop.in template that meson merges into
        # the real file, so validate a copy with the correct extension.
        run: |
          tmp="$(mktemp -d)"
          cp data/io.github.t00m.MiAZ.desktop.in "$tmp/io.github.t00m.MiAZ.desktop"
          desktop-file-validate "$tmp/io.github.t00m.MiAZ.desktop"

  build-meson:
    name: Meson build and install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          # A direct (non-DESTDIR) meson install runs glib-compile-schemas,
          # gtk4-update-icon-cache and update-desktop-database, so pull the
          # packages that provide them (libglib2.0-bin, libgtk-4-bin,
          # desktop-file-utils).
          sudo apt-get install -y \
            ninja-build gettext desktop-file-utils appstream-util \
            libglib2.0-bin libgtk-4-bin
          # meson.build requires >= 1.5.1; Ubuntu apt ships an older one, so
          # install meson from pip.
          python -m pip install --upgrade pip
          pip install "meson>=1.5.1"

      - name: Configure (release profile)
        run: meson setup builddir --prefix="$GITHUB_WORKSPACE/_inst" -Dprofile=release

      - name: Compile
        run: meson compile -C builddir

      - name: Install
        run: meson install -C builddir

      - name: Verify install tree
        run: |
          test -f "_inst/bin/miaz" || { echo "launcher _inst/bin/miaz missing"; exit 1; }
          test -d "_inst/share/MiAZ" || { echo "pkgdatadir _inst/share/MiAZ missing"; exit 1; }
          test -f "_inst/share/glib-2.0/schemas/io.github.t00m.MiAZ.gschema.xml" \
            || { echo "gschema not installed"; exit 1; }
          echo "Install tree looks good."
